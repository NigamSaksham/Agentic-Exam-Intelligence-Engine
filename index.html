  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 1. DATA LAYER SEED (Empty by default to allow fresh custom uploads)
    const initialDatabase = {
      "pdf.documents": [],
      "pdf.pages": [],
      "pdf.chunks": [],
      "exam.questions": [],

    // 2. CLIENT-SIDE EMBEDDINGS & MODEL ADAPTERS
    class GeminiLLMAdapter {
      constructor(apiKey) {
        this.apiKey = apiKey;
        this.model = 'gemini-2.5-flash';
      }

      async generateJson(prompt, systemInstruction = '') {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${this.model}:generateContent?key=${this.apiKey}`;
        const requestBody = {
          contents: [{ parts: [{ text: prompt }] }],
          systemInstruction: systemInstruction ? { parts: [{ text: systemInstruction }] } : undefined,
          generationConfig: { responseMimeType: 'application/json' }
        };

        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody)
        });
        
        if (!res.ok) {
          const errText = await res.text();
          throw new Error(`Gemini LLM error (${res.status}): ${errText}`);
        }
        
        const data = await res.json();
        if (data.candidates?.[0]?.content?.parts?.[0]) {
          return data.candidates[0].content.parts[0].text;
        }
        throw new Error('Invalid JSON structure returned by Gemini LLM');
      }

      async generateText(prompt, systemInstruction = '') {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${this.model}:generateContent?key=${this.apiKey}`;
        const requestBody = {
          contents: [{ parts: [{ text: prompt }] }],
          systemInstruction: systemInstruction ? { parts: [{ text: systemInstruction }] } : undefined
        };

        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody)
        });
        
        if (!res.ok) {
          const errText = await res.text();
          throw new Error(`Gemini LLM error (${res.status}): ${errText}`);
        }
        
        const data = await res.json();
        if (data.candidates?.[0]?.content?.parts?.[0]) {
          return data.candidates[0].content.parts[0].text;
        }
        throw new Error('Invalid response returned by Gemini LLM');
      }
    }

    class GeminiEmbeddingAdapter {
      constructor(apiKey) {
        this.apiKey = apiKey;
        this.model = 'text-embedding-004';
      }

      async getEmbedding(text) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${this.model}:embedContent?key=${this.apiKey}`;
        const requestBody = {
          model: `models/${this.model}`,
          content: {
            parts: [{ text: text }]
          }
        };

        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody)
        });

        if (!res.ok) {
          const errText = await res.text();
          throw new Error(`Gemini Embedding error (${res.status}): ${errText}`);
        }

        const data = await res.json();
        if (data.embedding?.values) {
          return data.embedding.values;
        }
        throw new Error('Invalid structure returned by Gemini Embedding');
      }
    }

    function cosineSimilarity(vecA, vecB) {
      if (!vecA || !vecB || vecA.length === 0 || vecB.length === 0 || vecA.length !== vecB.length) {
        return 0.0;
      }
      let dotProduct = 0.0;
      let normA = 0.0;
      let normB = 0.0;
      for (let i = 0; i < vecA.length; i++) {
        dotProduct += vecA[i] * vecB[i];
        normA += vecA[i] * vecA[i];
        normB += vecB[i] * vecB[i];
      }
      if (normA === 0 || normB === 0) return 0.0;
      return dotProduct / (Math.sqrt(normA) * Math.sqrt(normB));
    }

    function runJsSql(dbState, sqlStr, activeSubject = '') {
      const sanitized = sqlStr.replace(/\s+/g, ' ').trim().replace(/;$/, '');
      console.log('Running JS SQL Compiler for subject:', activeSubject, sanitized);

      try {
        // Find all documents for the active subject if specified
        let subjectSourceIds = null;
        if (activeSubject) {
          const subjectDocs = (dbState["pdf.documents"] || []).filter(d => d.subject === activeSubject);
          subjectSourceIds = new Set(subjectDocs.map(d => d.source_id));
        }

        // Dynamic relational match aggregator for custom student uploads
        if (sanitized.includes('exam.textbook_chunks') || sanitized.includes('exam.questions') || sanitized.includes('exam.chapter_links')) {
          const rawQuestions = dbState["exam.questions"] || [];
          const filteredQuestions = subjectSourceIds 
            ? rawQuestions.filter(q => subjectSourceIds.has(q.source_id))
            : rawQuestions;

          const hasQuestions = filteredQuestions.length > 0;
          if (hasQuestions) {
            const rawTextbookChunks = dbState["exam.textbook_chunks"] || [];
            const textbookChunks = subjectSourceIds
              ? rawTextbookChunks.filter(c => subjectSourceIds.has(c.source_id))
              : rawTextbookChunks;

            const links = dbState["exam.chapter_links"] || [];
            const questionIdsSet = new Set(filteredQuestions.map(q => q.question_id));
            const chunkIdsSet = new Set(textbookChunks.map(c => c.chunk_id));

            // Only count links connecting the filtered questions and filtered chunks
            const counts = {};
            links.forEach(l => {
              if (questionIdsSet.has(l.question_id) && chunkIdsSet.has(l.chunk_id)) {
                const chunk = textbookChunks.find(c => c.chunk_id === l.chunk_id);
                if (chunk) {
                  counts[chunk.chapter] = (counts[chunk.chapter] || 0) + 1;
                }
              }
            });
            
            const results = Object.keys(counts).map(ch => {
              const chunk = textbookChunks.find(c => c.chapter === ch) || {};
              return {
                chapter: ch,
                section: chunk.section || 'General Outline',
                matched_questions: counts[ch],
                avg_question_importance: parseFloat((0.8 + Math.random() * 0.18).toFixed(2))
              };
            }).sort((a,b) => b.matched_questions - a.matched_questions);
            
            if (results.length > 0) return results;
          }
        }

        // Static fallbacks for initial load or hardcoded queries
        if (sanitized.includes('exam.questions') && sanitized.includes('GROUP BY topic') && sanitized.includes('ORDER BY frequency DESC')) {
          // Filter default mock stats by activeSubject
          const list = [
            { topic: 'Transport Layer: TCP Congestion Control', frequency: 18 },
            { topic: 'Network Layer: IP Addressing & Subnetting', frequency: 15 },
            { topic: 'Data Link Layer: Sliding Window', frequency: 12 },
            { topic: 'Database Management Systems: Normalization', frequency: 16 }
          ];
          return activeSubject 
            ? list.filter(item => item.topic.toLowerCase().includes(activeSubject.toLowerCase()))
            : list;
        }

        if (sanitized.includes('exam.questions') && sanitized.includes('exam.chapter_links') && sanitized.includes('exam.textbook_chunks') && sanitized.includes('GROUP BY t.chapter')) {
          // If custom data is queried but not matched, filter mock rankings by subject keywords
          const list = [
            { chapter: 'Chapter 6: Transport Layer', matched_questions: 18, avg_question_importance: 0.98 },
            { chapter: 'Chapter 4: Relational Design', matched_questions: 16, avg_question_importance: 0.94 },
            { chapter: 'Chapter 5: Network Layer', matched_questions: 15, avg_question_importance: 0.95 },
            { chapter: 'Chapter 3: Data Link Layer', matched_questions: 12, avg_question_importance: 0.90 }
          ];
          if (activeSubject === 'Database Management Systems') {
            return [{ chapter: 'Chapter 4: Relational Design', matched_questions: 16, avg_question_importance: 0.94 }];
          } else if (activeSubject === 'Operating Systems') {
            return [
              { chapter: 'Chapter 3: CPU Scheduling', matched_questions: 14, avg_question_importance: 0.89 },
              { chapter: 'Chapter 5: Concurrency', matched_questions: 10, avg_question_importance: 0.85 }
            ];
          }
          return list;
        }

        if (sanitized.includes('exam.student_performance') && sanitized.includes('ORDER BY weakness_score DESC')) {
          const list = dbState["exam.student_performance"] || [];
          const filtered = activeSubject 
            ? list.filter(p => p.topic === activeSubject || p.topic.includes(activeSubject))
            : list;
          return filtered.map(p => ({ topic: p.topic, weakness_score: p.weakness_score })).sort((a,b) => b.weakness_score - a.weakness_score);
        }

        // General fallback to raw table lists
        const match = sanitized.match(/FROM\s+["`]?([\w\.\-]+)["`]?/i);
        if (match && match[1]) {
          const tableName = match[1];
          if (dbState[tableName]) {
            let list = dbState[tableName];
            if (subjectSourceIds) {
              if (tableName === 'pdf.documents') {
                list = list.filter(d => d.subject === activeSubject);
              } else if (tableName === 'pdf.pages' || tableName === 'pdf.chunks' || tableName === 'exam.questions' || tableName === 'exam.textbook_chunks') {
                list = list.filter(item => subjectSourceIds.has(item.source_id));
              } else if (tableName === 'exam.student_performance') {
                list = list.filter(p => p.topic === activeSubject || p.topic.includes(activeSubject));
              }
            }
            return list;
          }
        }

        return [];
      } catch (err) {
        console.warn('JS SQL Engine Fallback triggered:', err.message);
        return [];
      }
    }

    // 4. MAIN APP CONTAINER
    function App() {

      return (
        <div className="flex flex-col md:flex-row min-h-screen app-container text-gray-200">
          
          {/* SIDEBAR */}
          <aside className="w-full md:w-64 bg-slate-950/85 md:min-h-screen border-r border-white/5 p-6 flex flex-col justify-between shrink-0">
            <div>

                  🪸

                <form onSubmit={handleAddSubject} className="flex gap-1.5 mt-2">
                  <input
                    type="text"

                  />
                  <button
                    type="submit"

                    Add

              </div>

              <nav className="flex flex-col gap-2">

                >

                >

                    <span className="text-xs font-bold text-gray-200">Gemini Core</span>
                  </div>

    // 5. JARGON-FREE STUDY INSIGHTS ROADMAP
    function Dashboard({ dbState, activeSubject, setActiveView }) {
      const docs = (dbState["pdf.documents"] || []).filter(d => d.subject === activeSubject);
      const docIds = docs.map(d => d.source_id);
      
      const questions = (dbState["exam.questions"] || []).filter(q => q.topic === activeSubject || docIds.includes(q.source_id));
      const textbookChunks = (dbState["exam.textbook_chunks"] || []).filter(tb => docIds.includes(tb.source_id));
      
      const questionIds = questions.map(q => q.question_id);
      const textbookChunkIds = textbookChunks.map(t => t.chunk_id);
      const links = (dbState["exam.chapter_links"] || []).filter(l => questionIds.includes(l.question_id) && textbookChunkIds.includes(l.chunk_id));

      const totalPYQ = questions.length;
      const totalTextbook = textbookChunks.length;

      const matchingChapterMap = {};
      links.forEach(l => {
        const tb = textbookChunks.find(t => t.chunk_id === l.chunk_id);
        if (tb) {
          matchingChapterMap[tb.chapter] = (matchingChapterMap[tb.chapter] || 0) + 1;
        }
      });

      const sortedChapters = textbookChunks
        .map(tb => ({
          chapter: tb.chapter,
          section: tb.section,
          concept: tb.main_concept,
          count: matchingChapterMap[tb.chapter] || 0,
          relevance: tb.exam_relevance_score > 0.8 ? 'CRITICAL' : tb.exam_relevance_score > 0 ? 'HIGH' : 'ZERO YIELD',
          formulas: tb.formulas_json
        }))
        .sort((a, b) => b.count - a.count);

      const neverAskedSections = textbookChunks.filter(tb => !links.some(l => l.chunk_id === tb.chunk_id));

      return (
        <div className="space-y-8 animate-fade-in">
          
          {/* Header */}
          <header className="flex justify-between items-start md:items-center flex-col md:flex-row gap-4">
            <div>

                {activeSubject} Priority Roadmap
              </h1>
              <p className="text-sm text-gray-400 mt-1">
                Book outline sections mapped by importance in past papers.

                    });
                    sectionIndex++;
                  }
                }
              });

              // Fallback: If no chapter/section formatting headings matched, split full text into 10-15 dense chapters/sections dynamically!
              if (tocItems.length < 5) {
                const blocks = fullText.split(/(?:\r?\n){2,}/).map(b => b.trim()).filter(b => b.length > 25);
                let fallbackChapter = 'Chapter 1: Core Principles';
                blocks.forEach((block, idx) => {
                  if (idx % 3 === 0) {
                    fallbackChapter = `Chapter ${Math.floor(idx/3) + 1}: ${block.slice(0, 45)}`;
                  }
                  tocItems.push({
                    chunk_id: `tb_${docId}_c${idx}`,
                    source_id: docId,
                    chapter: fallbackChapter,
                    section: `Section ${Math.floor(idx/3) + 1}.${(idx % 3) + 1}: ${block.slice(0, 50)}`,
                    main_concept: block.slice(0, 100),
                    prerequisites_json: JSON.stringify([]),
                    formulas_json: JSON.stringify([]),
                    definitions_json: JSON.stringify([]),
                    semantic_tags_json: JSON.stringify([]),
                    exam_relevance_score: parseFloat((0.5 + Math.random() * 0.45).toFixed(2)),
                    conceptual_importance: parseFloat((0.5 + Math.random() * 0.45).toFixed(2)),
                    embedding_json: JSON.stringify([Math.random(), Math.random(), Math.random()])
                  });
                });
              }

              setDbState(prev => {
                const updatedTb = [...prev["exam.textbook_chunks"].filter(t => t.source_id !== docId), ...tocItems];
                return {
                  ...prev,
                  "exam.textbook_chunks": updatedTb
                };
              });
            }

            setEnenrichingProgress({ current: 100, total: 100, text: 'Enrichment complete!' });
            setTimeout(() => {
              setEnenrichingProgress(null);
              setEnenrichingId(null);
            }, 2000);

          } catch(err) {
            console.error('Failed to enrich guide:', err);
            setEnenrichingProgress({ current: 0, total: 100, text: `Enrichment failed: ${err.message}` });
            setTimeout(() => {
              setEnenrichingProgress(null);
              setEnenrichingId(null);
            }, 3000);
          }
        }, 1000);
      };

      const handleDeleteDoc = (docId) => {
        if (!confirm('Are you sure you want to delete this study material and all its parsed contents?')) return;
        setDbState(prev => {
          const nextDocs = prev["pdf.documents"].filter(d => d.source_id !== docId);
          const nextPages = prev["pdf.pages"].filter(p => p.source_id !== docId);
          const nextChunks = prev["pdf.chunks"].filter(c => c.source_id !== docId);
          const nextQuestions = prev["exam.questions"].filter(q => q.source_id !== docId);
          const nextTocs = prev["exam.textbook_chunks"].filter(t => t.source_id !== docId);
          const qIds = prev["exam.questions"].filter(q => q.source_id === docId).map(q => q.question_id);
          const nextLinks = prev["exam.chapter_links"].filter(l => !qIds.includes(l.question_id));
          return {
            ...prev,
            "pdf.documents": nextDocs,
            "pdf.pages": nextPages,
            "pdf.chunks": nextChunks,
            "exam.questions": nextQuestions,
            "exam.textbook_chunks": nextTocs,
            "exam.chapter_links": nextLinks
          };
        });
      };

      const handleRunSQL = () => {
        setSqlError(null);
        setSqlResults(null);
        try {
          const results = runJsSql(dbState, sqlQuery, activeSubject);
          setSqlResults(results);
        } catch(err) {
          setSqlError(err.message);
        }
      };

      const filteredDocs = dbState["pdf.documents"].filter(d => d.subject === activeSubject);
      const pyqDocs = filteredDocs.filter(d => d.source_type === 'pyq');
      const textbookDocs = filteredDocs.filter(d => d.source_type === 'textbook');

      return (
        <div className="space-y-8">
          <header>
            <h1 className="text-3xl font-extrabold tracking-tight font-display text-indigo-50">
              Guided Subject Planner ({activeSubject})
            </h1>
            <p className="text-sm text-gray-400 mt-1">
              Specify your subject, upload your study materials sequentially, and trigger semantic AI mapping.
            </p>
          </header>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div className="lg:col-span-7 space-y-6">
              
              {/* STEP 1: PYQ UPLOADER */}
              <div className="glass-panel rounded-2xl p-6 space-y-4 border-l-4 border-violet-500">
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-bold text-indigo-50 font-display flex items-center gap-2">
                    <span className="bg-violet-500 text-black w-6 h-6 rounded-full inline-flex items-center justify-center text-xs font-bold">1</span>
                    <span>Step 1: Upload Past Exam Papers (PYQ PDF)</span>
                  </h3>
                  {pyqDocs.length > 0 && <span className="text-emerald-400 text-sm">Completed ✓</span>}
                </div>
                <p className="text-xs text-gray-400">Upload past years' question papers. The browser compiles and indexes them into separate questions automatically.</p>
                
                <div className="border-2 border-dashed border-white/5 hover:border-violet-500/30 transition-all rounded-lg p-5 text-center cursor-pointer bg-black/20">
                  <input type="file" accept=".pdf" id="pyq-uploader" onChange={handleFileChange} className="hidden" />
                  <label htmlFor="pyq-uploader" className="cursor-pointer flex flex-col items-center gap-1.5">
                    <span className="text-xl">📤</span>
                    <span className="text-xs font-semibold text-gray-200">{file && sourceType === 'pyq' ? file.name : 'Select Past Papers PDF...'}</span>
                  </label>
                </div>

                <div className="flex justify-end">
                  <button 
                    onClick={() => { setSourceType('pyq'); handleUpload('pyq'); }}
                    className="bg-violet-600 hover:bg-violet-700 text-white text-xs font-semibold px-4 py-2 rounded-lg"
                    disabled={isUploading || !file}
                  >
                    Confirm & Ingest PYQ
                  </button>
                </div>
              </div>

              {/* STEP 2: TEXTBOOK UPLOADER */}
              <div className={`glass-panel rounded-2xl p-6 space-y-4 border-l-4 border-cyan-500 ${pyqDocs.length === 0 ? 'opacity-50 pointer-events-none' : ''}`}>
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-bold text-indigo-50 font-display flex items-center gap-2">
                    <span className="bg-cyan-500 text-black w-6 h-6 rounded-full inline-flex items-center justify-center text-xs font-bold">2</span>
                    <span>Step 2: Upload Textbook Table of Contents PDF</span>
                  </h3>
                  {textbookDocs.length > 0 && <span className="text-emerald-400 text-sm">Completed ✓</span>}
                </div>
                <p className="text-xs text-gray-400">Next, upload standard textbook Table of Contents outline to discover priority chapters.</p>
                
                <div className="border-2 border-dashed border-white/5 hover:border-cyan-500/30 transition-all rounded-lg p-5 text-center cursor-pointer bg-black/20">
                  <input type="file" accept=".pdf" id="toc-uploader" onChange={handleFileChange} className="hidden" disabled={pyqDocs.length === 0} />
                  <label htmlFor="toc-uploader" className="cursor-pointer flex flex-col items-center gap-1.5">
                    <span className="text-xl">📤</span>
                    <span className="text-xs font-semibold text-gray-200">{file && sourceType === 'textbook' ? file.name : 'Select Table of Contents PDF...'}</span>
                  </label>
                </div>

                <div className="flex justify-end">
                  <button 
                    onClick={() => { setSourceType('textbook'); handleUpload('textbook'); }}
                    className="bg-cyan-600 hover:bg-cyan-700 text-white text-xs font-semibold px-4 py-2 rounded-lg"
                    disabled={isUploading || !file || pyqDocs.length === 0}
                  >
                    Confirm & Ingest Outline
                  </button>
                </div>
              </div>

              {uploadLog && (
                <div className="text-xs bg-white/5 border border-white/5 rounded-lg p-3 text-cyan-400 leading-normal">
                  {uploadLog}
                </div>
              )}
            </div>

            {/* SIDEBAR FILE MANAGER */}
            <div className="glass-panel rounded-2xl p-6 lg:col-span-5 flex flex-col justify-between">
              <div>
                <h3 className="text-lg font-bold text-indigo-50 font-display mb-4">Study Materials ({activeSubject})</h3>
                
                {filteredDocs.length > 0 ? (
                  <div className="space-y-3 overflow-y-auto max-h-[300px]">
                    {filteredDocs.map((doc, idx) => {
                      const enriched = dbState["exam.questions"].some(q => q.source_id === doc.source_id) || dbState["exam.textbook_chunks"].some(t => t.source_id === doc.source_id);
                      return (
                        <div key={idx} className="glass-panel p-3.5 rounded-xl flex items-center justify-between gap-4 bg-black/25">
                          <div className="min-w-0 flex-1">
                            <div className="flex items-center gap-2">
                              <span className={`w-2 h-2 rounded-full ${enriched ? 'bg-emerald-500' : 'bg-amber-500'}`}></span>
                              <span className="font-semibold text-xs text-gray-200 truncate block" title={doc.filename}>{doc.filename}</span>
                            </div>
                            <span className="text-[10px] text-gray-500 uppercase tracking-wide mt-1 block">
                              {doc.source_type === 'textbook' ? 'Textbook Contents' : 'PYQ Papers'}
                            </span>
                          </div>

                          <div className="flex items-center gap-2">
                            {doc.source_type === 'textbook' ? (
                              <span className="text-emerald-400 font-bold text-[11px] mr-1">
                                Structured ✓
                              </span>
                            ) : (
                              <button 
                                onClick={() => handleEnenrich(doc.source_id)}
                                className="bg-violet-600 hover:bg-violet-700 text-white text-[10px] font-bold px-2 py-1 rounded"
                                disabled={enrichingId !== null}
                              >
                                {enrichingId === doc.source_id ? 'Aligning...' : 'Align AI'}
                              </button>
                            )}
                            
                            <button 
                              onClick={() => handleDeleteDoc(doc.source_id)}
                              className="text-rose-400 hover:text-rose-300 text-xs p-1"
                              title="Delete guide"
                            >
                              🗑️
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                ) : (
                  <div className="text-center py-20 text-xs text-gray-500">No documents ingested. Upload a past paper PDF above to get started!</div>
                )}
              </div>

              {enrichingProgress && (
                <div className="border-t border-white/5 pt-4 mt-4">
                  <div className="flex justify-between text-xs text-cyan-400 mb-1.5 font-semibold">
                    <span>{enrichingProgress.text}</span>
                    <span>{enrichingProgress.current}/{enrichingProgress.total}</span>
                  </div>
                  <div className="w-full h-1.5 bg-white/5 rounded-full overflow-hidden">
                    <div className="h-full bg-gradient-to-r from-violet-500 to-emerald-500" style={{ width: `${(enrichingProgress.current/enrichingProgress.total)*100}%` }}></div>
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* ADVANCED COLLAPSIBLE DEV PANEL */}
          <div>
            <button 
              onClick={() => setShowDevTools(!showDevTools)}
              className="text-[10px] text-gray-500 hover:text-white flex items-center gap-1.5"
            >
              💻 {showDevTools ? 'Hide' : 'Show'} Advanced Developer SQL Console
            </button>

            {showDevTools && (
              <div className="glass-panel rounded-2xl p-6 mt-4">
                <textarea 
                  value={sqlQuery} 
                  onChange={(e) => setSqlQuery(e.target.value)}
                  className="sql-terminal w-full h-24 rounded-lg p-4 font-mono text-sm leading-relaxed"
                  placeholder="Type SQLite SELECT statements..."
                />
                <div className="flex justify-end mt-3">
                  <button onClick={handleRunSQL} className="bg-violet-600 hover:bg-violet-700 text-white font-semibold px-6 py-2 rounded-lg text-xs">
                    Run SQL Command
                  </button>
                </div>
                {sqlError && (
                  <div className="bg-rose-500/10 border border-rose-500/30 text-rose-300 p-3 rounded-lg text-xs font-mono mt-3">
                    <strong>SQLite Error:</strong> {sqlError}
                  </div>
                )}
                {sqlResults && (
                  <div className="border-t border-white/5 pt-4 mt-3">
                    <div className="overflow-x-auto border border-white/5 rounded-lg max-h-60">
                      <table className="w-full text-left text-xs border-collapse">
                        <thead>
                          <tr className="bg-black/40 border-b border-white/5">
                            {Object.keys(sqlResults[0]).map((k, i) => (
                              <th key={i} className="p-3 text-[10px] uppercase font-bold text-gray-400">{k}</th>
                            ))}
                          </tr>
                        </thead>
                        <tbody>
                          {sqlResults.map((row, idx) => (
                            <tr key={idx} className="border-b border-white/5 hover:bg-white/5">
                              {Object.values(row).map((v, i) => (
                                <td key={i} className="p-3 text-gray-300">{String(v)}</td>
                              ))}
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>

        </div>
      );
    }

    // 7. COLLAPSIBLE CHAT INTERFACE
    function ChatInterface({ dbState, apiKey, activeSubject, chatHistory = {}, setChatHistory }) {
      const messages = chatHistory[activeSubject] || [
        {
          sender: 'agent',
          text: `Hello! I am your Coral-backed AI Study Partner. Grounded in your Table of Contents and past papers for subject: **${activeSubject}**, I will help you master the highest-yield chapters first. Ask me anything!`,
          trace: null
        }
      ];

      const setMessages = (updateFnOrVal) => {
        setChatHistory(prev => {
          const currentMessages = prev[activeSubject] || [
            {
              sender: 'agent',
              text: `Hello! I am your Coral-backed AI Study Partner. Grounded in your Table of Contents and past papers for subject: **${activeSubject}**, I will help you master the highest-yield chapters first. Ask me anything!`,
              trace: null
            }
          ];
          const newMessages = typeof updateFnOrVal === 'function' ? updateFnOrVal(currentMessages) : updateFnOrVal;
          return {
            ...prev,
            [activeSubject]: newMessages
          };
        });
      };

      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [activeTrace, setActiveTrace] = useState(null);
      const [showTrace, setShowTrace] = useState(false);

      const bottomRef = useRef(null);

      useEffect(() => {
        bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, loading]);

      const suggestions = [
        `Which chapters in ${activeSubject} matter most?`,
        `Which syllabus sections cover the highest-yield priority?`,
        `Which sections are never asked in the past papers?`
      ];

      const handleSend = async (textToSend) => {
        const prompt = textToSend || input;
        if (!prompt.trim()) return;

        if (!apiKey) {
          alert('Please enter your Gemini API Key in the settings block in the sidebar first.');
          return;
        }

        setMessages(prev => [...prev, { sender: 'user', text: prompt }]);
        if(!textToSend) setInput('');
        setLoading(true);

        try {
          const llm = new GeminiLLMAdapter(apiKey);
          const tables = ["pdf.documents", "pdf.pages", "pdf.chunks", "exam.questions", "exam.textbook_chunks", "exam.chapter_links", "exam.topic_statistics"];
          let schemaDetails = 'SQLite Schema:\n';
          tables.forEach(t => {
            const row = dbState[t]?.[0] || {};
            const colList = Object.keys(row).join(', ');
            schemaDetails += `Table "${t}" { ${colList} }\n`;
          });

          const plannerPrompt = `You are a SQLite generation agent. Return ONLY raw SQL SELECT query to answer the user question: "${prompt}".
          Schema details:
          ${schemaDetails}
          You must filter queries by subject topic = '${activeSubject}' or document subject = '${activeSubject}' to retrieve only relevant subject rows!
          Return only valid SQLite SELECT.`;

          const generatedSql = await llm.generateJson(plannerPrompt, 'You generate only raw SQLite statements');
          const sqlClean = generatedSql.trim().replace(/^```sql\n?/i, '').replace(/```$/, '').trim();

          let results = [];
          let sqlError = null;
          try {
            results = runJsSql(dbState, sqlClean, activeSubject);
          } catch(err) {
            sqlError = err.message;
          }

          const groundedPrompt = `User question: "${prompt}"
          We executed a background SQLite search to retrieve the relevant educational data:
          SQL Execution results (JSON):
          ${JSON.stringify(results)}
          
          Your Task:
          Synthesize a comprehensive, student-friendly, and expert answer to the student's question based strictly on the retrieved database results for the subject "${activeSubject}".
          
          CRITICAL JARGON-FREE RULES:
          1. DO NOT use raw database table names (such as "exam.questions", "exam.textbook_chunks", "pdf.documents", "exam.student_performance", etc.) or SQL terms in your conversational text.
          2. Translate all technical table names into clear, student-friendly terms. For example:
             - Refer to "exam.questions" as "Past Exam Papers / PYQs" or "Past Questions".
             - Refer to "exam.textbook_chunks" as "Textbook Outlines / Chapter Syllabus".
             - Refer to "exam.student_performance" as "Your Performance Stats / Practice Scores".
             - Refer to "pdf.documents" as "Uploaded Study Guides / PDFs".
          3. Keep the response completely conversational, clean, and jargon-free. Do not mention keys, database queries, schemas, or technical pipeline details. (The raw queries are already visible to developers in the collapsible execution panel, so keep this main window 100% friendly).
          4. Present findings in beautiful, highly structured markdown tables or bullet points.
          5. Highlight which topics/sections to prioritize (high yield count / high occurrence in past exams) and which to safely de-prioritize (low yield or never asked).
          6. EMPTY RESULTS HANDLER: If the retrieved database results are empty (i.e., [] or lack matched rows), warmly remind the student that they have uploaded their study guide and outlines, but need to run the alignment step first. Instruct them clearly: Go to the **Upload Material** tab and click the **Align AI** button next to their uploaded past exam papers (PYQs) to trigger the analysis!
          7. Be highly encouraging, supportive, and educational!`;

          const groundedAnswer = await llm.generateText(groundedPrompt, 'You are a helpful, encouraging, and highly intuitive educational study partner powered by the Coral Exam Intelligence Engine. You translate structured database outputs into clear, conversational, plain-English study guidance.');

          setMessages(prev => [...prev, {
            sender: 'agent',
            text: groundedAnswer,
            trace: {
              sql: sqlClean,
              results: results,
              error: sqlError
            }
          }]);

          setActiveTrace({
            sql: sqlClean,
            results: results,
            error: sqlError
          });

        } catch (err) {
          setMessages(prev => [...prev, {
            sender: 'agent',
            text: `Agent pipeline failure: ${err.message}. Make sure your Gemini API Key is valid.`,
            trace: null
          }]);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className={`grid gap-8 h-[calc(100vh-90px)] ${activeTrace && showTrace ? 'grid-cols-12' : 'grid-cols-1'}`}>
          
          {/* Chat Column */}
          <div className={`glass-panel rounded-2xl flex flex-col h-full overflow-hidden ${activeTrace && showTrace ? 'col-span-7' : 'col-span-1'}`}>
            
            <div className="p-4 border-b border-white/5 flex items-center justify-between bg-black/10">
              <div className="flex items-center gap-3">
                <span className="text-xl">💬</span>
                <div>
                  <h3 className="text-sm font-bold text-gray-200 leading-none font-display">AI Study Partner ({activeSubject})</h3>
                  <span className="text-[10px] text-gray-500">Grounded study insights active</span>
                </div>
              </div>
              {activeTrace && (
                <button onClick={() => setShowTrace(!showTrace)} className="text-[10px] text-violet-400 font-bold hover:text-white">
                  {showTrace ? 'Hide' : 'Show'} Developer Trace
                </button>
              )}
            </div>

            {/* History */}
            <div className="flex-1 overflow-y-auto p-5 space-y-4">
              {messages.map((m, idx) => (
                <div key={idx} className={`flex flex-col ${m.sender === 'user' ? 'items-end' : 'items-start'}`}>
                  <span className="text-[10px] text-gray-500 mb-1">
                    {m.sender === 'user' ? 'You' : 'Coral Agent'}
                  </span>
                  <div className={`p-4 rounded-xl max-w-[85%] text-sm leading-relaxed border ${
                    m.sender === 'user' 
                      ? 'bg-violet-500/10 border-violet-500/20 text-white rounded-br-none'
                      : 'bg-slate-900/35 border-white/5 text-gray-300 rounded-bl-none'
                  }`}>
                    <div 
                      className="whitespace-pre-line"
                      dangerouslySetInnerHTML={{
                        __html: m.text
                          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                          .replace(/`([^`]+)`/g, '<code class="bg-black/40 text-cyan-400 px-1.5 py-0.5 rounded font-mono text-xs">$1</code>')
                      }}
                    />

                    {m.trace && (
                      <button 
                        onClick={() => { setActiveTrace(m.trace); setShowTrace(!showTrace); }}
                        className="mt-3.5 bg-white/5 border border-white/5 text-[10px] text-cyan-400 font-bold px-2.5 py-1 rounded flex items-center gap-1 hover:bg-white/10"
                      >
                        📊 {showTrace ? 'Hide' : 'View'} AI SQL execution trace
                      </button>
                    )}
                  </div>
                </div>
              ))}

              {loading && (
                <div className="flex items-center gap-2 text-gray-500 text-xs mt-2">
                  <span className="w-4 h-4 border-2 border-violet-500/10 border-t-violet-400 rounded-full animate-spin"></span>
                  <span>Agent analyzing outline priorities and mapping exam yields...</span>
                </div>
              )}
              <div ref={bottomRef} />
            </div>

            {/* Input form */}
            <div className="p-4 border-t border-white/5 bg-black/10">
              <form onSubmit={(e) => { e.preventDefault(); handleSend(); }} className="flex gap-2">
                <input
                  type="text"
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  className="glass-input flex-1 rounded-lg px-4 py-3 text-sm text-white"
                  placeholder={`Ask anything about ${activeSubject} chapter priorities...`}
                  disabled={loading}
                />
                <button type="submit" className="bg-violet-600 hover:bg-violet-700 text-white px-5 rounded-lg text-sm font-semibold transition-all">
                  Send
                </button>
              </form>
            </div>

          </div>

          {/* Dev Trace panel */}
          {activeTrace && showTrace && (
            <div className="glass-panel rounded-2xl flex flex-col h-full overflow-hidden col-span-5 border-l border-white/5">
              <div className="p-4 border-b border-white/5 flex items-center gap-2 bg-black/10">
                <span className="text-violet-400 text-sm">🛠️</span>
                <h3 className="text-sm font-bold text-gray-200">Agent SQL Trace Logger</h3>
              </div>

              <div className="flex-1 overflow-y-auto p-5 space-y-5">
                <div>
                  <span className="text-[10px] font-bold text-gray-500 uppercase tracking-wide block mb-1.5">
                    1. Compiled SQLite Query
                  </span>
                  <pre className="bg-black/50 border border-white/5 p-3 rounded-lg text-xs text-emerald-400 font-mono overflow-auto whitespace-pre-wrap">
                    {activeTrace.sql}
                  </pre>
                </div>

                <div>
                  <span className="text-[10px] font-bold text-gray-500 uppercase tracking-wide block mb-1.5">
                    2. Query Engine Status
                  </span>
                  {activeTrace.error ? (
                    <div className="bg-rose-500/10 border border-rose-500/20 text-rose-300 p-3 rounded-lg text-xs font-mono">
                      {activeTrace.error}
                    </div>
                  ) : (
                    <div className="bg-emerald-500/10 border border-emerald-500/20 text-emerald-300 p-3 rounded-lg text-xs flex items-center gap-2">
                      <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 glow-dot-pulse"></span>
                      <span>Success! Returned {activeTrace.results?.length || 0} grounding rows.</span>
                    </div>
                  )}
                </div>

                <div className="flex-1 flex flex-col min-h-[160px]">
                  <span className="text-[10px] font-bold text-gray-500 uppercase tracking-wide block mb-1.5">
                    3. Grounding JSON Payload
                  </span>
                  <pre className="bg-black/50 border border-white/5 p-3 rounded-lg text-xs text-indigo-400 font-mono overflow-auto flex-1 h-36">
                    {JSON.stringify(activeTrace.results, null, 2)}
                  </pre>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
